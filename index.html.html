const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d.toISOString().slice(0,10)});

`<div class="stat-grid">${metrics.map(x=>stat(...x)).join('')}</div><div class="layout-2"><div class="panel panel-pad">${panelTitle('Hoạt động đặt vé theo 7 ngày','Biểu đồ phản ánh dữ liệu xác nhận, không dùng số liệu cứng.')}`+

`<div class="panel panel-pad">${panelTitle(r==='support'?'Việc cần xử lý':'Đơn hàng gần đây',r==='support'?'Phản ánh và tin nhắn của du khách':'Các trạng thái mới nhất trong hệ thống')}`+
`<div class="activity-list">${r==='support'?db.reports.slice(0,5).map(x=>`<div class="activity-item"><span class="activity-icon">📣</span><div><b>${E(x.text.slice(0,85))}</b><small>${E(x.author)} · ${statusNames[x.status]}</small></div></div>`).join(''):recent.map(o=>`<div class="activity-item"><span class="activity-icon">🎟️</span><div><b>${E(pname(o.place))} <span class="muted">${money(o.total)}</span></b><small>${E(o.id)} · ${statusNames[o.status]||o.status}</small></div></div>`).join('')||empty('Chưa có đơn nào')}</div></div></div>`}
function renderDiscover(){const items=db.places.filter(p=>p.status==='active'&&matches(p.name+' '+p.province+' '+p.category));const results=items.filter(p=>ui.filter==='all'||p.category===ui.filter);const view=ui.tabs.discover||'list';const page=Math.max(0,ui.page.discover||0);const pages=Math.max(1,Math.ceil(results.length/6));const safePage=Math.min(page,pages-1);ui.page.discover=safePage;

if(ui.role==='partner'&&x.owner===owner())acts+=`<button class="btn primary" data-action="edit-media" data-id="${x.id}">Chỉnh sửa</button>`;
openModal(x.title,`<div class="gap-8">${pill(x.status)}<span class="pill info">${E(x.type)}</span><span class="small-note">${fmt(x.date)} · ${E(x.place)}</span></div><div class="qa-box mt-18">${E(x.summary)}</div>`,acts,'BÀI VIẾT · SỰ KIỆN · THÔNG BÁO')}
function rewardRules(){if(ui.role!=='admin')return;let s=db.settings;openModal('Quy tắc tích sao & quy đổi',`<form id="entityForm" data-kind="rules" class="field-grid">${field('Sao / check-in','rewardCheckin',s.rewardCheckin,'number','min="0" max="10000"')}${field('Sao / đánh giá được duyệt','rewardReview',s.rewardReview,'number','min="0" max="10000"')}${field('Sao / đơn thành công','rewardBooking',s.rewardBooking,'number','min="0" max="10000"')}${field('Giá trị 1 sao (VNĐ)','rate',s.rate,'number','min="1" max="10000"')}${field('Giảm tối đa (% giá trị đơn)','maxDiscount',s.maxDiscount,'number','min="0" max="100"')}</form>`,formFooter('Lưu quy tắc'),'LOYALTY ENGINE')}
function editPolicy(){if(ui.role!=='admin')return;openModal('Chính sách hệ thống',`<form id="entityForm" data-kind="policy" class="field-grid">${textfield('Giới thiệu hệ thống','intro',db.settings.intro,3)}${textfield('Nội dung chính sách / hỗ trợ','policies',db.settings.policies,6)}</form>`,formFooter('Lưu chính sách'),'CỔNG QUẢN TRỊ NỘI DUNG')}
function tripDetail(id){const x=db.itineraries.find(y=>y.id===id);if(!x)return;openModal(`Hành trình ${x.province}`,`<div class="notice">${x.days} ngày · ${x.stops.length} điểm đến · Tạo ${fmt(x.date)}</div>${x.stops.map((p,i)=>`<div class="timeline"><span class="timeline-num">${i+1}</span><div><strong>${E(pname(p))}</strong><p>${E(place(p)?.transit||'Tìm phương tiện phù hợp')}</p></div></div>`).join('')}`,`<button class="btn" data-action="close">Đóng</button><button class="btn danger" data-action="trip-delete" data-id="${id}">Xóa hành trình</button>`,'LỊCH TRÌNH ĐƯỢC LƯU')}
function submitEntity(form){const kind=form.dataset.kind,id=form.dataset.id||'new',f=Object.fromEntries(new FormData(form));const clean=n=>String(f[n]??'').trim();const n=num=>Number(f[num])||0;
if(kind==='place'){
 const p=db.places.find(x=>x.id===id);if(p&&ui.role==='partner'&&p.partner!==owner())return toast('Không có quyền chỉnh sửa','bad');
 const values={name:clean('name'),province:clean('province'),category:clean('category'),partner:ui.role==='partner'?owner():clean('partner'),price:Math.max(0,n('price')),stock:Math.max(0,Math.floor(n('stock'))),hours:clean('hours'),transit:clean('transit'),lat:n('lat'),lng:n('lng'),radius:Math.max(20,n('radius')),narration:clean('narration'),status:clean('status')};
 if(!values.name||!values.province||Math.abs(values.lat)>90||Math.abs(values.lng)>180)return toast('Kiểm tra lại tên, tỉnh thành và tọa độ','bad');
 if(p)Object.assign(p,values);else db.places.unshift({id:uid('p'),...values});toast('Đã lưu địa điểm / dịch vụ');
}else if(kind==='partner'){
 if(ui.role!=='admin')return;const x=db.partners.find(x=>x.id===id);const values={name:clean('name'),contact:clean('contact'),province:clean('province'),status:clean('status'),note:clean('note')};if(!values.name||!values.contact.includes('@'))return toast('Tên hoặc email không hợp lệ','bad');if(x)Object.assign(x,values);else db.partners.push({id:uid('pt'),...values});toast('Đã lưu hồ sơ đối tác');
}else if(kind==='book'){
 const p=place(id);if(!p)return;let qty=Math.floor(n('qty')),day=clean('date');if(qty<1||qty>p.stock||day<dateAfter(0))return toast('Ngày sử dụng hoặc số lượng vé không hợp lệ','bad');
 let gross=p.price*qty,available=ui.role==='tourist'?Math.max(0,balance(owner())):0;
 const pointsUsed=f.usePoints?Math.min(available,Math.floor((gross*db.settings.maxDiscount/100)/db.settings.rate)):0;
 let order={id:uid('PT'),place:p.id,customer:ui.role==='tourist'?'Du khách Minh Anh':roles[ui.role].name,owner:ui.role==='tourist'?owner():'admin@pubtrip.vn',qty,date:day,status:'pending',created:new Date().toISOString(),total:Math.max(0,gross-pointsUsed*db.settings.rate),pointsUsed,pointsDebited:false,rewarded:false,ticketType:clean('ticketType'),method:clean('method'),code:''};db.orders.unshift(order);toast('Đã tạo đơn chờ xác nhận');persist();closeModal();navigate('bookings');orderDetail(order.id);return;
}else if(kind==='review'){
 let x=clean('text');if(x.length<8)return toast('Đánh giá cần tối thiểu 8 ký tự','bad');db.reviews.unshift({id:uid('rv'),place:clean('place'),owner:owner(),author:'Du khách Minh Anh',rating:Math.min(5,Math.max(1,n('rating'))),text:x,status:'pending',rewarded:false,date:new Date().toISOString()});ui.tabs.community='reviews';toast('Đã gửi đánh giá để kiểm duyệt');
}else if(kind==='new-report'){
 let x=clean('text');if(x.length<8)return toast('Phản ánh cần tối thiểu 8 ký tự','bad');db.reports.unshift({id:uid('rp'),place:clean('place'),owner:owner(),author:'Du khách Minh Anh',text:x,status:'new',assigned:'',reply:'',date:new Date().toISOString()});ui.tabs.community='reports';toast('Đã tiếp nhận phản ánh');
}else if(kind==='report'){
 if(!['admin','support'].includes(ui.role))return;let x=db.reports.find(x=>x.id===id);if(!x)return;Object.assign(x,{status:clean('status'),assigned:clean('assigned'),reply:clean('reply')});toast('Đã cập nhật kết quả xử lý');
}else if(kind==='knowledge'){
 let x=db.knowledge.find(x=>x.id===id);const p=place(clean('place'));if(ui.role==='partner'&&p?.partner!==owner())return toast('Không thể sửa nội dung của đối tác khác','bad');const values={title:clean('title'),place:clean('place'),text:clean('text'),language:clean('language'),radius:Math.max(20,n('radius')),status:clean('status')};if(!values.title||!values.text)return toast('Chưa nhập nội dung','bad');if(x)Object.assign(x,values);else db.knowledge.unshift({id:uid('k'),...values});toast('Đã cập nhật kho tri thức');
}else if(kind==='media'){
 let x=db.media.find(x=>x.id===id);if(ui.role==='partner'&&x&&x.owner!==owner())return toast('Không phải bài của bạn','bad');const values={title:clean('title'),type:clean('type'),summary:clean('summary'),place:clean('place'),date:clean('date'),status:ui.role==='partner'?clean('status'):clean('status')};if(!values.title||!values.summary)return toast('Cần có tiêu đề và nội dung','bad');if(x)Object.assign(x,values);else db.media.unshift({id:uid('m'),owner:ui.role==='admin'?'admin':owner(),...values});toast('Đã lưu nội dung truyền thông');
}else if(kind==='rules'){
 if(ui.role!=='admin')return;for(let key of ['rewardCheckin','rewardReview','rewardBooking','rate','maxDiscount'])db.settings[key]=Math.max(key==='rate'?1:0,Math.floor(n(key)));db.settings.maxDiscount=Math.min(100,db.settings.maxDiscount);toast('Đã cập nhật quy tắc điểm thưởng');
}else if(kind==='policy'){
 if(ui.role!=='admin')return;db.settings.intro=clean('intro');db.settings.policies=clean('policies');toast('Đã lưu chính sách');
}
persist();closeModal();render();}
function transitionOrder(id,status){const o=db.orders.find(x=>x.id===id);if(!o)return;
if(!['admin','partner','tourist'].includes(ui.role))return;
if(ui.role==='tourist'&&o.owner!==owner()||ui.role==='partner'&&place(o.place)?.partner!==owner())return toast('Không có quyền truy cập đơn','bad');
if(status==='confirmed'&&o.status==='pending'){
 const p=place(o.place);if(!p||p.stock<o.qty)return toast('Không đủ tồn kho demo','bad');
 if(o.pointsUsed>0){if(balance(o.owner)<o.pointsUsed)return toast('Không đủ số dư sao','bad');db.ledger.unshift({id:uid('l'),owner:o.owner,delta:-o.pointsUsed,reason:'Đổi sao cho đơn '+o.id,created:new Date().toISOString()});o.pointsDebited=true}
 p.stock-=o.qty;o.status='confirmed';o.code=uid('PT-QR-');o.confirmedAt=new Date().toISOString();if(!o.rewarded&&o.owner==='tourist@pubtrip.vn'){db.ledger.unshift({id:uid('l'),owner:o.owner,delta:db.settings.rewardBooking,reason:'Đơn vé thành công '+o.id,created:new Date().toISOString()});o.rewarded=true}
 toast('Đã xác nhận thanh toán mô phỏng');
}else if(status==='cancelled'&&o.status==='pending'){o.status='cancelled';toast('Đã hủy đơn chưa thanh toán');}
else if(status==='refunded'&&o.status==='confirmed'){
 o.status='refunded';place(o.place).stock+=o.qty;
 if(o.pointsDebited&&o.pointsUsed>0)db.ledger.unshift({id:uid('l'),owner:o.owner,delta:o.pointsUsed,reason:'Hoàn sao cho đơn '+o.id,created:new Date().toISOString()});
 if(o.rewarded)db.ledger.unshift({id:uid('l'),owner:o.owner,delta:-db.settings.rewardBooking,reason:'Thu hồi sao thưởng đơn hoàn '+o.id,created:new Date().toISOString()});
 o.code='';toast('Đã hoàn đơn và trả lại tồn kho (demo)');
}else return toast('Không thể chuyển trạng thái đơn này','bad');
persist();closeModal();render();orderDetail(o.id);
}
function checkIn(placeId){if(ui.role!=='tourist')return;const p=place(placeId);if(!p)return;const done=db.ledger.some(x=>x.owner===owner()&&x.ref==='checkin:'+placeId);if(done)return toast('Bạn đã check-in địa điểm này trong bản demo','bad');db.ledger.unshift({id:uid('l'),ref:'checkin:'+placeId,owner:owner(),delta:db.settings.rewardCheckin,reason:'Check-in tại '+p.name,created:new Date().toISOString()});persist();closeModal();toast(`Check-in thành công! +${db.settings.rewardCheckin} ★`)}
function reviewStatus(id,status){if(!['admin','support'].includes(ui.role))return;const x=db.reviews.find(x=>x.id===id);if(!x||x.status!=='pending')return toast('Đánh giá đã được xử lý','bad');x.status=status;
if(status==='published'&&!x.rewarded){db.ledger.unshift({id:uid('l'),owner:x.owner,delta:db.settings.rewardReview,reason:'Đánh giá được duyệt: '+pname(x.place),created:new Date().toISOString()});x.rewarded=true}persist();closeModal();render();toast('Đã '+(status==='published'?'duyệt':'từ chối')+' đánh giá')}
function applyChatAction(action,id){const ch=db.chats.find(x=>x.id===id);if(!ch||!['admin','support'].includes(ui.role))return;
if(action==='chat-assign'){ch.assigned=roles[ui.role].name;ch.status='open'}else if(action==='chat-close'){ch.status='closed'}persist();render();toast('Đã cập nhật hội thoại')}
function buddyReply(question){let terms=question.toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const found=db.places.filter(p=>{const hay=(p.name+' '+p.province).toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'');return hay.split(' ').some(w=>w.length>3&&terms.includes(w))});const items=(found.length?found:db.places.filter(p=>p.category==='Khám phá')).slice(0,3);
return `Gợi ý từ cơ sở dữ liệu PubTrip:\n${items.map((p,i)=>`${i+1}. ${p.name} (${p.province}) — ${p.transit}. Giá tham khảo: ${money(p.price)}.`).join('\n')}\nBạn có thể mở tab Tạo hành trình để lưu lịch trình. (Trả lời từ kịch bản demo, không phải AI trực tuyến.)`}
function speak(text){if(!('speechSynthesis' in window)){toast('Trình duyệt này chưa hỗ trợ Text-to-Speech','bad');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.rate=.95;speechSynthesis.speak(u);toast('Đang phát thuyết minh qua trình duyệt')}
function showNarration(id,elementId){const k=db.knowledge.find(x=>x.place===id&&x.status==='published'),p=place(id);const message=k?.text||p?.narration||'Chưa có nội dung thuyết minh.';const el=$('#'+elementId);if(el)el.textContent=`📍 ${p?.name||''}\nVùng thuyết minh: ${k?.radius||p?.radius||150}m\n\n${message}`;speak(message)}
function csvEscape(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function download(name,data,mime='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportCsv(){let rows=periodOrders();download('pubtrip_donhang_demo.csv','\ufeff'+[['Mã đơn','Địa điểm','Khách hàng','Số vé','Ngày','Giá','Trạng thái'].join(','),...rows.map(x=>[x.id,pname(x.place),x.customer,x.qty,x.date,x.total,x.status].map(csvEscape).join(','))].join('\r\n'),'text/csv;charset=utf-8');toast('Đã xuất bảng thống kê CSV')}
function askReset(){openModal('Khôi phục dữ liệu mẫu',`<div class="notice warn">Thao tác này xóa tất cả thay đổi đã lưu trong bản demo ở trình duyệt hiện tại. Hãy xuất JSON trước khi khôi phục nếu muốn giữ dữ liệu.</div>`,`<button class="btn" data-action="close">Hủy</button><button class="btn danger" data-action="confirm-reset">Xóa thay đổi & khôi phục</button>`,'XÁC NHẬN THAO TÁC')}
function quickSearchModal(){openModal('Tìm nhanh',`<p class="small-note">Tìm địa điểm, đơn hàng hoặc bài viết trong dữ liệu demo.</p><input class="input" id="globalSearch" placeholder="Tên điểm đến, mã đơn, bài viết..."><div class="qa-box mt-12" id="globalResults">Nhập từ khóa để xem kết quả.</div>`,'<button class="btn" data-action="close">Đóng</button>','TRA CỨU NHANH')}
function renderGlobalResults(q){const items=[...db.places.filter(x=>(x.name+x.province).toLowerCase().includes(q)).slice(0,6).map(x=>({label:x.name,sub:x.province,act:'place-detail',id:x.id})),...db.orders.filter(x=>x.id.toLowerCase().includes(q)).slice(0,4).map(x=>({label:x.id,sub:pname(x.place),act:'order-detail',id:x.id}))];$('#globalResults').innerHTML=items.map(x=>`<div class="map-item" data-action="${x.act}" data-id="${x.id}"><strong>${E(x.label)}</strong><small>${E(x.sub)}</small></div>`).join('')||empty('Không tìm thấy nội dung')}
function clickAction(el){const a=el.dataset.action,id=el.dataset.id||'',s=el.dataset.status||'';
switch(a){
case 'nav':navigate(id);break;case 'tab':ui.tabs[el.dataset.key]=id;ui.page={};ui.query='';render();break;case 'role':setRole(id);break;case 'open-roles':closeModal();$('#roleMenu').classList.remove('hidden');break;
case 'filter':ui.filter=id;render();break;case 'page':ui.page[id]=Math.max(0,(ui.page[id]||0)+Number(el.dataset.dir||0));render(false);break;
case 'close':closeModal();break;case 'place-detail':placeDetail(id);break;case 'edit-place':editPlace(id);break;case 'map-select':ui.selectedPlace=id;render(false);break;case 'book-place':bookPlace(id);break;case 'order-detail':orderDetail(id);break;
case 'demo-order':bookPlace(db.places[0].id);break;case 'order-transition':transitionOrder(id,s);break;
case 'verify-ticket':{const o=db.orders.find(x=>x.id===id);toast(o?.status==='confirmed'&&o.code?'Mã vé demo hợp lệ: '+o.code:'Mã vé không hợp lệ','' );break;}
case 'edit-partner':editPartner(id);break;case 'partner-approve':{const x=partner(id);if(!x)return;if(x.status!=='pending')return editPartner(id);x.status='approved';persist();render();toast('Đã phê duyệt '+x.name);break;}
case 'edit-review':editReview();break;case 'edit-report':editReport();break;case 'review-detail':reviewDetail(id);break;case 'report-detail':reportDetail(id);break;case 'review-status':reviewStatus(id,s);break;
case 'checkin':checkIn(id);break;case 'reward-rules':rewardRules();break;case 'edit-knowledge':editKnowledge(id);break;case 'edit-media':editMedia(id);break;case 'media-detail':mediaDetail(id);break;case 'media-publish':{const x=db.media.find(y=>y.id===id);if(x&&ui.role==='admin'){x.status='published';persist();closeModal();render();toast('Đã xuất bản bài viết')}break;}
case 'geo-enter':{const p=$('#geo-select');if(!p)return;ui.selectedGeo=p.value;showNarration(p.value,'geo-result');break;}
case 'read-narration':{const p=$('#narrationPlace');if(!p)return;showNarration(p.value,'narrationResult');break;}
case 'stop-speech':if('speechSynthesis' in window)speechSynthesis.cancel();toast('Đã dừng thuyết minh');break;
case 'geo-location':{const out=$('#narrationResult');if(!navigator.geolocation){out.textContent='Trình duyệt không hỗ trợ định vị.';break;}out.textContent='Đang xin quyền vị trí...';navigator.geolocation.getCurrentPosition(loc=>{const {latitude,longitude}=loc.coords;const nearest=db.places.map(p=>({...p,d:distance(latitude,longitude,p.lat,p.lng)})).sort((a,b)=>a.d-b.d)[0];out.textContent=`Vị trí GPS đã cấp quyền. Địa điểm gần nhất trong danh sách: ${nearest.name}, cách khoảng ${Math.round(nearest.d)}m. ${nearest.d<=nearest.radius?'Đang trong vùng thuyết minh.':'Chưa nằm trong vùng thuyết minh.'}`;if(nearest.d<=nearest.radius)speak(db.knowledge.find(x=>x.place===nearest.id&&x.status==='published')?.text||nearest.narration);},()=>out.textContent='Không có quyền vị trí hoặc không lấy được GPS. Bạn vẫn có thể dùng nút Mô phỏng.',{timeout:8000,enableHighAccuracy:false});break;}
case 'buddy-preset':{const msg=buddyReply('Du lịch '+id);const el=$('#buddyAnswer');if(el)el.textContent=msg;break;}
case 'trip-detail':tripDetail(id);break;case 'trip-delete':db.itineraries=db.itineraries.filter(x=>x.id!==id);persist();closeModal();render();toast('Đã xóa hành trình');break;
case 'select-chat':ui.selectedChat=id;render(false);break;case 'chat-assign':case 'chat-close':applyChatAction(a,id);break;
case 'create-chat':{let x={id:uid('c'),customer:'Du khách Minh Anh',owner:owner(),status:'waiting',assigned:'',messages:[]};db.chats.unshift(x);ui.selectedChat=x.id;persist();render();break;}
case 'export-csv':exportCsv();break;case 'edit-policy':editPolicy();break;case 'export-json':download('pubtrip_backup_demo.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');toast('Đã sao lưu dữ liệu JSON');break;
case 'import-json':$('#importFile')?.click();break;case 'reset-data':askReset();break;case 'confirm-reset':db=sample();persist();closeModal();render();toast('Đã khôi phục dữ liệu mẫu');break;
case 'quick-search':quickSearchModal();break;
}}
function distance(a,b,c,d){const r=6371000,rad=Math.PI/180,v1=(c-a)*rad,v2=(d-b)*rad,h=Math.sin(v1/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(v2/2)**2;return r*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
function renderGoToSearchRestore(){const input=$('#quick-filter');if(input){const p=Math.max(0,ui.query.length);input.focus();try{input.setSelectionRange(p,p)}catch(e){}}}
// Submit handlers for all interactive forms
window.addEventListener('submit',e=>{const form=e.target;if(!form?.id)return;e.preventDefault();if(form.id==='entityForm'){submitEntity(form);return}if(form.id==='tripForm'){let f=Object.fromEntries(new FormData(form));let spots=db.places.filter(p=>p.province===f.province).slice(0,Math.max(1,Number(f.days)*2));if(!spots.length)return toast('Chưa có địa điểm thuộc tỉnh đã chọn','bad');db.itineraries.unshift({id:uid('t'),owner:owner(),province:f.province,days:Math.max(1,Number(f.days)),stops:spots.map(p=>p.id),date:new Date().toISOString()});persist();ui.tabs.trips='saved';render();toast('Đã tạo và lưu hành trình');return}
if(form.id==='buddyForm'){const question=new FormData(form).get('question');$('#buddyAnswer').textContent=buddyReply(question);return}

&&matches(x.days+' '+x.depart+' '+x.arrive)),[['Tuyến',x=>E(t.routes.find(r=>r.id===x.route)?.code)],['Ngày hoạt động',x=>E(x.days)],['Chuyến đầu',x=>E(x.depart)],['Chuyến đến',x=>E(x.arrive)],['Trạng thái',x=>pill(x.status)],['Thao tác',x=>actionable('transport','transport-edit-schedule',x.id,'Sửa')]],'schedules'):`<div class="qa-box"><b>GTFS Static / GTFS Realtime (mô phỏng)</b><p class="small-note">Nhận tên tệp .zip/.txt/.csv và nhật ký gửi dữ liệu; chưa giải nén hay xác thực chuẩn GTFS.</p><form id="gtfsForm" class="field-grid">${selectfield('Loại dữ liệu','type',[['static','GTFS Static'],['realtime','GTFS Realtime']],'static')}<div class="field"><label>Chọn tệp mẫu</label><input class="input" type="file" name="file" accept=".zip,.csv,.txt" required></div><div class="full"><button class="btn primary">Ghi nhận tệp demo</button></div></form>${table(t.imports.filter(x=>ui.role==='admin'||x.partner===owner()),[['Tên tệp',x=>E(x.file)],['Loại',x=>x.type==='static'?'GTFS Static':'GTFS Realtime'],['Đơn vị',x=>E(partname(x.partner))],['Trạng thái',x=>'<span class="pill info">Đã nhận tên tệp</span>']], 'gtfs')}</div>`}</div>`}

if(kind==='stop'){let x=t.stops.find(y=>y.id===id)||{name:'',code:'',area:'Hà Nội',lat:21.0278,lng:105.8248};openModal(id==='new'?'Thêm trạm dừng':'Sửa trạm dừng',`<form id="entityForm" data-kind="transport-stop" data-id="${id}" class="field-grid">${field('Tên trạm','name',x.name,'text','required')}${field('Mã trạm','code',x.code,'text','required')}${field('Địa bàn','area',x.area,'text','required')}${field('Vĩ độ','lat',x.lat,'number','required step="any" min="-90" max="90"')}${field('Kinh độ','lng',x.lng,'number','required step="any" min="-180" max="180"')}</form>`,formFooter('Lưu trạm'),'VỊ TRÍ TRẠM DỪNG')}
if(kind==='schedule'){let x=t.schedules.find(y=>y.id===id)||{route:transportScopedRoutes()[0]?.id||'',days:'Thứ 2–Chủ nhật',depart:'06:00',arrive:'07:00',status:'active'};openModal(id==='new'?'Thêm lịch chạy':'Chỉnh sửa lịch',`<form id="entityForm" data-kind="transport-schedule" data-id="${id}" class="field-grid">${selectfield('Tuyến xe','route',transportScopedRoutes().map(x=>[x.id,x.code+' · '+x.name]),x.route)}${field('Ngày hoạt động','days',x.days,'text','required')}${field('Giờ xuất phát','depart',x.depart,'time','required')}${field('Giờ kết thúc','arrive',x.arrive,'time','required')}${selectfield('Trạng thái','status',[['active','Đang chạy'],['hidden','Tạm dừng']],x.status)}</form>`,formFooter('Lưu lịch'),'LỊCH TRÌNH DỊCH VỤ')}

// Transport CRUD isolated from original form logic.
const originalSubmitEntity=submitEntity;
submitEntity=function(form){const kind=form.dataset.kind,id=form.dataset.id||'new';if(!kind.startsWith('transport-')&&kind!=='place'&&kind!=='partner'&&kind!=='staff')return originalSubmitEntity(form);const f=new FormData(form), v=n=>String(f.get(n)||'').trim();
if(kind==='transport-route'){const a=db.transport.routes.find(x=>x.id===id),values={code:v('code'),name:v('name'),mode:v('mode'),partner:ui.role==='partner'?owner():v('partner'),from:v('from'),to:v('to'),frequency:Math.max(1,Number(v('frequency'))||15),first:v('first'),last:v('last'),status:v('status'),stops:f.getAll('stops')};if(!values.code||!values.name||!values.from||!values.to)return toast('Vui lòng điền đủ thông tin tuyến','bad');if(a&&ui.role==='partner'&&a.partner!==owner())return toast('Không có quyền sửa tuyến này','bad');if(a)Object.assign(a,values);else db.transport.routes.unshift({id:uid('r'),...values});toast('Đã lưu tuyến vận tải demo');}
else if(kind==='transport-stop'){const a=db.transport.stops.find(x=>x.id===id),values={name:v('name'),code:v('code'),area:v('area'),lat:Number(v('lat')),lng:Number(v('lng'))};if(!values.name||!values.code||Math.abs(values.lat)>90||Math.abs(values.lng)>180)return toast('Dữ liệu trạm không hợp lệ','bad');if(a)Object.assign(a,values);else db.transport.stops.push({id:uid('st'),...values});toast('Đã lưu trạm dừng demo')}
else if(kind==='transport-schedule'){const a=db.transport.schedules.find(x=>x.id===id),values={route:v('route'),days:v('days'),depart:v('depart'),arrive:v('arrive'),status:v('status')};if(!transportScopedRoutes().some(x=>x.id===values.route))return toast('Chọn tuyến thuộc đơn vị được cấp quyền','bad');if(a)Object.assign(a,values);else db.transport.schedules.push({id:uid('sc'),...values});toast('Đã lưu lịch chạy demo')}
else if(kind==='place'){const a=db.places.find(x=>x.id===id);const image=v('imageData')||v('image');originalSubmitEntity(form);const saved=a||db.places[0];if(saved&&image){saved.image=image;persist();render()}return;}
else if(kind==='partner'){const a=db.partners.find(x=>x.id===id);const values={name:v('name'),contact:v('contact').toLowerCase(),province:v('province'),kind:v('kind'),tax:v('tax'),representative:v('representative'),phone:v('phone'),address:v('address'),legalFile:v('legalFile'),status:v('status'),note:v('note')};if(!values.name||!values.contact.includes('@'))return toast('Tên công ty hoặc email chưa hợp lệ','bad');if(a)Object.assign(a,values);else db.partners.unshift({id:uid('pt'),...values});for(const acct of accounts.filter(y=>y.partnerId===(a?.id||'__none__'))){acct.status=values.status==='approved'?'active':values.status==='pending'?'pending':values.status;acct.name=values.name;}saveAccounts();toast('Đã cập nhật hồ sơ đối tác')}
else if(kind==='staff'){if(ui.role!=='admin')return;let email=v('email').toLowerCase();if(!email.includes('@'))return toast('Email không hợp lệ','bad');let a=accounts.find(x=>x.email===email);if(id==='new'&&a)return toast('Email đã tồn tại','bad');if(a){a.name=v('name');a.status=v('status');a.role=v('role')}else accounts.push({email,name:v('name'),role:v('role'),status:v('status'),hash:passwordHash(v('password')||'Demo@12345')});saveAccounts();toast('Đã lưu tài khoản nhân viên demo')}
 db.logs ||= [];db.logs.unshift({id:uid('log'),action:'Cập nhật '+kind,who:session?.email,when:new Date().toISOString()});persist();closeModal();render();}

};

renderPartners=function(){let tab=ui.tabs.partners||'companies',arr=db.partners.filter(p=>matches(p.name+' '+p.contact));return header('Tài khoản & đối tác','Thẩm định hồ sơ đăng ký, kích hoạt tài khoản và quản lý nhân viên nội bộ.',`<button class="btn primary" data-action="${tab==='staff'?'edit-staff':'edit-partner'}" data-id="new">＋ ${tab==='staff'?'Cấp tài khoản':'Thêm đối tác'}</button>`,'QUẢN LÝ QUYỀN TRUY CẬP')+`<div class="panel panel-pad">${subnav('partners',[['companies','Hồ sơ đối tác'],['staff','Tài khoản nhân viên'],['audit','Nhật ký thao tác']])}${tab==='companies'?`<div class="toolbar"><input id="quick-filter" class="search-input" placeholder="Tìm đối tác..." value="${E(ui.query)}"><span class="small-note">${db.partners.filter(x=>x.status==='pending').length} hồ sơ chờ duyệt</span></div>${table(arr,[['Đối tác',x=>`<strong>${E(x.name)}</strong><small>${E(x.contact)} · ${x.kind==='transport'?'Vận tải':'Du lịch'}</small>`],['Mã số thuế',x=>E(x.tax||'—')],['Hồ sơ',x=>E(x.legalFile||'Chưa có tệp')],['Trạng thái',x=>pill(x.status)],['Thao tác',x=>rowBtns([{action:'edit-partner',id:x.id,text:'Chi tiết'},{action:'partner-approve',id:x.id,text:'Duyệt',kind:'primary'}])]],'partners')}`:tab==='staff'?table(accounts.filter(a=>a.role!=='partner'),[['Nhân viên',x=>`<strong>${E(x.name)}</strong><small>${E(x.email)}</small>`],['Vai trò',x=>roles[x.role]?.name||'—'],['Trạng thái',x=>pill(x.status)],['Thao tác',x=>actionable('partners','edit-staff',x.email,'Sửa')]],'staff'):`${table((db.logs||[]).slice().reverse(),[['Thời gian',x=>fmt(x.when)],['Tài khoản',x=>E(x.who)],['Hành động',x=>E(x.action)]],'audit')}`}</div>`}
editPartner=function(id){if(ui.role!=='admin')return;const p=partner(id)||null,b=p||{name:'',contact:'',province:'',note:'',status:'pending',kind:'travel',tax:'',representative:'',phone:'',address:'',legalFile:''};openModal(p?'Xét duyệt hồ sơ đối tác':'Thêm hồ sơ đối tác',`<form id="entityForm" data-kind="partner" data-id="${p?.id||'new'}" class="field-grid">${field('Tên doanh nghiệp','name',b.name,'text','required')}${field('Email liên hệ','contact',b.contact,'email','required')}${selectfield('Loại đối tác','kind',[['travel','Du lịch / khu tham quan'],['transport','Vận tải công cộng']],b.kind)}${field('Mã số thuế / mã đăng ký','tax',b.tax)}${field('Người đại diện','representative',b.representative)}${field('Số điện thoại','phone',b.phone)}${field('Địa bàn hoạt động','province',b.province)}${field('Địa chỉ liên hệ','address',b.address)}${field('Tên tệp hồ sơ đã nhận','legalFile',b.legalFile)}${selectfield('Trạng thái xét duyệt','status',[['pending','Chờ thẩm định'],['approved','Phê duyệt'],['rejected','Yêu cầu bổ sung / từ chối'],['suspended','Tạm khóa']],b.status)}${textfield('Ghi chú thẩm định','note',b.note)}</form><div class="section-note">Hồ sơ demo chỉ lưu tên tệp, chưa lưu bản PDF thực tế. Chuyển trạng thái “Phê duyệt” để đối tác có thể đăng nhập.</div>`,formFooter('Lưu và cập nhật xét duyệt'),'HỒ SƠ PHÁP LÝ / PARTNER PORTAL')}
function editStaff(email){const a=accounts.find(x=>x.email===email)||{name:'',email:'',role:'support',status:'active'};openModal(email==='new'?'Cấp tài khoản nội bộ':'Chỉnh sửa nhân viên',`<form id="entityForm" data-kind="staff" data-id="${email}" class="field-grid">${field('Họ tên','name',a.name,'text','required')}${field('Email đăng nhập','email',a.email,'email',email==='new'?'required':'readonly')}${selectfield('Vai trò','role',[['support','Hỗ trợ viên'],['admin','Quản trị viên']],a.role)}${selectfield('Trạng thái','status',[['active','Hoạt động'],['suspended','Tạm khóa']],a.status)}${email==='new'?field('Mật khẩu ban đầu (demo)','password','Demo@12345','text','minlength="8" required'):''}</form>`,formFooter('Lưu tài khoản'),'TÀI KHOẢN ĐƯỢC ADMIN CẤP')}
const originalSettings=renderSettings;
renderSettings=function(){let sub=ui.tabs.settings;return header('Cài đặt & dữ liệu','Cấu hình tài khoản nội bộ và sao lưu dữ liệu web demo.','','QUẢN TRỊ CÁ NHÂN')+`<div class="panel panel-pad">${subnav('settings',[['profile','Tài khoản của tôi'],['policy','Chính sách'],['data','Sao lưu demo']])}${sub==='profile'?`<div class="layout-equal"><div class="qa-box"><div class="key">TÀI KHOẢN ĐANG ĐĂNG NHẬP</div><h3>${E(session?.name||'')}</h3><p>${E(session?.email||'')} · ${roles[ui.role].name}</p><button class="btn danger" data-action="logout">↪ Đăng xuất</button></div><div class="qa-box"><div class="key">BẢO MẬT DEMO</div><p>Chưa sử dụng sinh trắc học hay API xác thực phía máy chủ.</p><button class="btn" data-action="auth-password">Đổi mật khẩu demo</button></div></div>`:sub==='policy'?`<div class="qa-box"><strong>Chính sách & hỗ trợ</strong><p>${E(db.settings.policies)}</p><p>${E(db.settings.intro)}</p></div>${ui.role==='admin'?`<button class="btn primary mt-12" data-action="edit-policy">Chỉnh sửa chính sách</button>`:''}`:`<div class="notice warn">Dữ liệu chỉ lưu trên trình duyệt hiện tại, KHÔNG đồng bộ dữ liệu Mobile hoặc hệ thống khác.</div><div class="gap-8"><button class="btn" data-action="export-json">↓ Sao lưu JSON</button><button class="btn" data-action="import-json">↑ Nhập JSON</button><button class="btn danger" data-action="reset-data">↺ Khôi phục</button></div><input type="file" accept=".json" id="importFile" class="hidden">`}</div>`}
// Ticket operations for the WEB portal: verify codes & simulate reconciliation, not real QR payments.
const baseRenderBookings=renderBookings;
renderBookings=function(){const tab=ui.tabs.bookings||'all';const extra='<button class="tab-btn '+(tab==='verify'?'active':'')+'" data-action="tab" data-key="bookings" data-id="verify">Kiểm tra mã vé</button><button class="tab-btn '+(tab==='reconcile'?'active':'')+'" data-action="tab" data-key="bookings" data-id="reconcile">Đối soát</button>';
 if(tab==='verify')return header('Kiểm tra vé nội bộ','Đối chiếu mã vé đã cấp, xác nhận chưa sử dụng và ghi nhận lượt vào cổng mô phỏng.','','VẬN HÀNH VÉ ĐIỆN TỬ')+`<div class="panel panel-pad"><div class="tabs"><button class="tab-btn" data-action="tab" data-key="bookings" data-id="all">← Danh sách đơn</button>${extra}</div><div class="transport-banner">Vé QR thật cần hệ thống ký và xác thực tại máy chủ. Công cụ này CHỈ xác minh mã vé mẫu lưu trên trình duyệt.</div><form id="ticketLookup" class="field-grid"><div class="field"><label>Mã vé điện tử (mã PT-QR...)</label><input class="input" name="code" placeholder="Nhập mã PT-QR..." required></div><div class="field"><label>Kiểm tra</label><button class="btn primary">🔎 Tra cứu vé demo</button></div></form><div id="ticketLookupResult" class="qa-box mt-18">Nhập mã vé từ một đơn đã xác nhận.</div></div>`;
 if(tab==='reconcile'){const rows=periodOrders(),completed=rows.filter(o=>o.status==='confirmed'),refunded=rows.filter(o=>o.status==='refunded');return header('Đối soát giao dịch','Theo dõi tiền vé đã xác nhận, hoàn hủy và trạng thái đối soát dữ liệu mô phỏng.',`<button class="btn" data-action="export-csv" data-id="orders">↓ Xuất báo cáo CSV</button>`,'BÁO CÁO & ĐỐI SOÁT')+`<div class="stat-grid">${stat('Giao dịch xác nhận',completed.length,'✅','Trong kỳ demo')}${stat('Tổng giá trị vé',money(completed.reduce((sum,o)=>sum+o.total,0)),'₫','Không phải tiền thật')}${stat('Đã đánh dấu đối soát',completed.filter(o=>o.reconciled).length,'◉','Theo nhật ký demo')}${stat('Hoàn vé',refunded.length,'↩','Chưa đối soát ngân hàng')}</div><div class="panel panel-pad"><div class="tabs"><button class="tab-btn" data-action="tab" data-key="bookings" data-id="all">← Danh sách đơn</button>${extra}</div>${table(completed,[['Mã đơn',o=>`<strong>${E(o.id)}</strong><small>${E(o.customer)}</small>`],['Đối tác',o=>E(partname(place(o.place)?.partner))],['Số tiền',o=>money(o.total)],['Đối soát',o=>o.reconciled?'<span class="pill approved">Đã đánh dấu</span>':'<span class="pill pending">Chưa đối soát</span>'],['Thao tác',o=>o.reconciled?'—':actionable('bookings','reconcile-order',o.id,'Xác nhận')]],'reconcile')}</div><p class="small-note mt-12">Đánh dấu nội bộ chỉ có ý nghĩa trong web demo; chưa kết nối cổng ngân hàng.</p>`;}
 const html=baseRenderBookings();const end=html.indexOf('</div>',html.indexOf('class="tabs"'));return end===-1?html:html.slice(0,end)+extra+html.slice(end);
};
function checkTicketCode(raw){const code=String(raw||'').trim().toUpperCase();const o=db.orders.find(x=>String(x.code||'').toUpperCase()===code);const out=$('#ticketLookupResult');if(!out)return;if(!code||!o||o.status!=='confirmed'||(ui.role==='partner'&&place(o.place)?.partner!==owner())){out.innerHTML='<span class="pill rejected">Không tìm thấy vé hợp lệ</span><p>Không có mã vé hợp lệ trong dữ liệu web demo hiện tại.</p>';return;}out.innerHTML=`<div class="flex-between"><div><strong>${E(o.code)}</strong><p>${E(pname(o.place))} · ${E(o.customer)}</p><span class="small-note">${fmt(o.date)} · ${o.qty} vé</span></div>${o.usedAt?'<span class="pill rejected">Đã sử dụng</span>':'<span class="pill approved">Chưa sử dụng</span>'}</div>${o.usedAt?`<p class="small-note mt-12">Ghi nhận vào cổng: ${fmt(o.usedAt)}</p>`:`<button class="btn primary mt-12" data-action="ticket-mark-used" data-id="${E(o.id)}">✓ Ghi nhận vé đã sử dụng (demo)</button>`}`;}

const oldClickAction=clickAction;
clickAction=function(el){const a=el.dataset.action,id=el.dataset.id||'';
if(a==='logout'){portalLogout();return}
if(a==='auth-mode'){authSwitch(id);return}
if(a==='register-back'){authStep='email';showAuth('register');if(pendingSignup){const f=$('#authRegisterPart1');for(const k of ['business','email','tax','representative','phone']){let x=f.querySelector('[name='+k+']');if(x)x.value=pendingSignup[k]||''}f.querySelector('[name=kind]').value=pendingSignup.kind}return}
if(a==='auth-fill'){const email=$('#authLogin [name=email]'),pass=$('#authLogin [name=password]');if(email&&pass){email.value=id;pass.value='Demo@12345';pass.focus()}return}
if(a==='edit-transport'){let tab=ui.tabs.transport||'routes';transportForm(tab==='stops'?'stop':tab==='schedules'?'schedule':'route');return}
if(a==='transport-detail'){transportDetail(id);return}
if(a==='transport-edit-route'){transportForm('route',id);return}
if(a==='transport-edit-stop'){transportForm('stop',id);return}
if(a==='transport-edit-schedule'){transportForm('schedule',id);return}
if(a==='edit-staff'){editStaff(id);return}
if(a==='reconcile-order'){const o=db.orders.find(x=>x.id===id);if(!o||o.status!=='confirmed'||ui.role==='partner'&&place(o.place)?.partner!==owner())return; o.reconciled=true;db.logs||=[];db.logs.unshift({id:uid('log'),when:new Date().toISOString(),who:session.email,action:'Đối soát đơn '+o.id});persist();render();toast('Đã đối soát đơn mô phỏng');return}
if(a==='ticket-mark-used'){const o=db.orders.find(x=>x.id===id);if(!o||o.usedAt||o.status!=='confirmed'||ui.role==='partner'&&place(o.place)?.partner!==owner())return toast('Mã vé không hợp lệ','bad');o.usedAt=new Date().toISOString();persist();checkTicketCode(o.code);toast('Đã ghi nhận lượt sử dụng mã vé');return}
if(a==='auth-password'){authStep='email';authEmail=session.email;authOTP=String(Math.floor(100000+Math.random()*900000));authExpiry=Date.now()+300000;portalLogout();authStep='code';showAuth('forgot','Đã tạo mã xác minh demo cho '+authEmail);return}
if(a==='partner-approve'){const x=partner(id);if(!x||ui.role!=='admin')return;if(x.status!=='pending')return editPartner(id);x.status='approved';accounts.filter(y=>y.partnerId===x.id).forEach(y=>y.status='active');saveAccounts();db.logs||=[];db.logs.unshift({id:uid('log'),who:session.email,action:'Phê duyệt '+x.name,when:new Date().toISOString()});persist();render();toast('Đã kích hoạt đối tác '+x.name);return}
return oldClickAction(el)}
// Override app router, route still called by pagination/search/nav.
render=function(scroll=true){if(!session)return;let name=nav.find(n=>n.id===ui.section)?.name||'Tổng quan';$('#breadcrumb').textContent=name;$('#crumbDesc').textContent=roles[ui.role].sub;const routes={overview:renderOverview,partners:renderPartners,transport:renderTransport,places:renderPlaces,bookings:renderBookings,community:renderCommunity,loyalty:renderLoyalty,content:renderContent,media:renderMedia,support:renderSupport,settings:renderSettings};$('#page').innerHTML=(routes[ui.section]||renderOverview)();if(scroll)window.scrollTo({top:0,behavior:'instant'})};
// register partner and reset flows: all credentials local only for demonstration.
let authExpiry=0;
window.addEventListener('submit',e=>{const form=e.target;if(!form.id.startsWith('auth')&&form.id!=='gtfsForm'&&form.id!=='ticketLookup')return;e.preventDefault();const f=new FormData(form),v=k=>String(f.get(k)||'').trim();
if(form.id==='ticketLookup'){checkTicketCode(v('code'));return}
if(form.id==='authLogin'){authenticate(v('email'),v('password'));return}
if(form.id==='authRegisterPart1'){const email=v('email').toLowerCase();if(accounts.some(x=>x.email===email)||db.partners.some(x=>x.contact===email))return showAuth('register','Email đã được sử dụng trên hệ thống demo.');pendingSignup={business:v('business'),email,kind:v('kind'),tax:v('tax'),representative:v('representative'),phone:v('phone')};authStep='legal';showAuth('register');return}
if(form.id==='authRegister'){let email=pendingSignup?.email||'';if(accounts.some(x=>x.email===email)||db.partners.some(x=>x.contact===email))return showAuth('register','Email đã được sử dụng trên hệ thống demo.');if(v('password')!==v('confirm')||v('password').length<8)return showAuth('register','Mật khẩu tối thiểu 8 ký tự và hai lần nhập phải giống nhau.');const file=f.get('legalFile');if(!file?.name)return showAuth('register','Cần chọn tệp hồ sơ pháp lý để tiếp tục.');pendingSignup={...pendingSignup,province:v('province'),address:v('address'),legalFile:file.name,hash:passwordHash(v('password'))};authEmail=email;authOTP=String(Math.floor(100000+Math.random()*900000));authExpiry=Date.now()+300000;authStep='verify';showAuth('register','Vui lòng nhập OTP mô phỏng để xác minh email trước khi gửi hồ sơ.');return}
if(form.id==='authRegisterOTP'){if(!pendingSignup||Date.now()>authExpiry||v('otp')!==authOTP)return showAuth('register','Mã OTP không hợp lệ hoặc đã hết hạn; chọn Đăng ký để nhập lại.');const data=pendingSignup,id=uid('pt');db.partners.unshift({id,name:data.business,contact:data.email,kind:data.kind,tax:data.tax,representative:data.representative,phone:data.phone,province:data.province,address:data.address,legalFile:data.legalFile,note:'Đã xác minh OTP demo, chờ Admin thẩm định hồ sơ pháp lý',status:'pending'});accounts.push({email:data.email,name:data.business,role:'partner',partnerId:id,status:'pending',hash:data.hash});pendingSignup=null;authStep='email';authOTP='';saveAccounts();persist();showAuth('login','Đã xác minh email demo và gửi hồ sơ. Tài khoản chờ Admin phê duyệt mới có thể đăng nhập.');return}
if(form.id==='authForgotEmail'){let email=v('email').toLowerCase();if(!accounts.some(x=>x.email===email))return showAuth('forgot','Email chưa được đăng ký trong dữ liệu demo.');authEmail=email;authOTP=String(Math.floor(100000+Math.random()*900000));authExpiry=Date.now()+5*60*1000;authStep='code';showAuth('forgot');return}
if(form.id==='authForgotCode'){if(Date.now()>authExpiry||v('otp')!==authOTP)return showAuth('forgot','Mã không đúng hoặc hết hạn; chọn Quên mật khẩu để yêu cầu lại.');authStep='password';showAuth('forgot');return}
if(form.id==='authForgotPassword'){if(Date.now()>authExpiry)return showAuth('forgot','Mã đã hết hạn, vui lòng bắt đầu lại.');if(v('password').length<8||v('password')!==v('confirm'))return showAuth('forgot','Mật khẩu ít nhất 8 ký tự, hai lần nhập phải giống nhau.');const a=accounts.find(x=>x.email===authEmail);if(a){a.hash=passwordHash(v('password'));saveAccounts()}authStep='email';authOTP='';showAuth('login','Đổi mật khẩu demo thành công. Bạn có thể đăng nhập lại.');return}
if(form.id==='gtfsForm'){const file=f.get('file');if(!file?.name)return toast('Vui lòng chọn tệp','bad');if(!/\.(zip|csv|txt)$/i.test(file.name))return toast('Chỉ chấp nhận tên tệp ZIP/CSV/TXT','bad');db.transport.imports.unshift({id:uid('imp'),file:file.name,type:v('type'),partner:ui.role==='partner'?owner():'pt4',date:new Date().toISOString()});persist();render();toast('Đã ghi nhận tên tệp GTFS (demo, chưa phân tích tệp).');return}
});
// Image file processing for location admin forms.
window.addEventListener('change',e=>{if(e.target.id!=='photoUpload')return;const file=e.target.files?.[0];if(!file)return;if(file.size>4*1024*1024)return toast('Ảnh quá 4 MB, vui lòng chọn ảnh nhỏ hơn','bad');if(!/^image\/(png|jpeg|webp)$/.test(file.type))return toast('Chỉ hỗ trợ JPG, PNG, WebP','bad');const img=new Image();const object=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,960/img.width,620/img.height),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*scale));cv.height=Math.max(1,Math.round(img.height*scale));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);const data=cv.toDataURL('image/jpeg',.72);$('#imageData').value=data;const prev=document.querySelector('.photo-preview img');if(prev)prev.src=data;URL.revokeObjectURL(object);toast('Đã chuẩn bị ảnh; bấm Lưu để cập nhật')};img.onerror=()=>{URL.revokeObjectURL(object);toast('Không đọc được ảnh','bad')};img.src=object});

initializePortal();
</script>
